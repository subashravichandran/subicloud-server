name: nextcloud

services:
  nextcloud:
    image: ${IMAGE}:${IMAGE_TAG}

    container_name: ${CONTAINER_NAME}

    restart: unless-stopped

    environment:
      - POSTGRES_HOST
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD

      - REDIS_HOST
      - REDIS_HOST_PASSWORD

      - NEXTCLOUD_ADMIN_USER
      - NEXTCLOUD_ADMIN_PASSWORD

      - NEXTCLOUD_TRUSTED_DOMAINS

    volumes:
      - ${APP_DATA_DIR}/data:/var/www/html

    networks:
      default:
        aliases:
          - nextcloud

networks:
  default:
    name: ${NETWORK_NAME}
    external: true