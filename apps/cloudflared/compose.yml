name: cloudflared

services:
  cloudflared:
    image: ${IMAGE}:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME}

    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - run
    restart: unless-stopped

    volumes:
      - ${APP_DATA_DIR}/config.yml:/etc/cloudflared/config.yml:ro
      - ${APP_DATA_DIR}/credentials.json:/etc/cloudflared/credentials.json:ro

    networks:
      - default

networks:
  default:
    external: true
    name: ${NETWORK_NAME}